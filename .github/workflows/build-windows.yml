# Builds the standalone Windows .exe automatically (PyInstaller only builds
# for the OS it's running on — this workflow runs it on a real, free
# Microsoft-hosted Windows machine via GitHub Actions, so you never need to
# own a Windows PC to produce the Windows build).
#
# Setup: push this repo to GitHub, then either push to `main` or trigger it
# manually from the Actions tab ("Run workflow"). When it finishes, download
# the "Pinnacle-Dashboard-Windows" artifact from the workflow run — that's
# the .exe. Unrelated to (and does not replace) the Mac build, which you
# build locally with the same dashboard.spec.

name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller dashboard.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: Pinnacle-Dashboard-Windows
          path: dist/Pinnacle Dashboard.exe
